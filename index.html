<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Browser Minecraft Clone</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

// --- Scene & Camera ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(10, 5, 25);

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Light ---
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// --- Terrain (green blocks) ---
const chunkSize = 20;
const geometry = new THREE.BoxGeometry(1,1,1);
for(let x=0;x<chunkSize;x++){
  for(let z=0;z<chunkSize;z++){
    const height = Math.floor(Math.random()*3)+1;
    for(let y=0;y<height;y++){
      const material = new THREE.MeshStandardMaterial({color:0x228B22});
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x, y, z);
      scene.add(cube);
    }
  }
}

// Optional floor plane
const planeGeometry = new THREE.PlaneGeometry(50,50);
const planeMaterial = new THREE.MeshStandardMaterial({color:0x006400});
const plane = new THREE.Mesh(planeGeometry, planeMaterial);
plane.rotation.x = -Math.PI/2;
plane.position.y = -0.5;
scene.add(plane);

// --- Basic First-Person Controls ---
const keys = {};
document.addEventListener('keydown', e => keys[e.code]=true);
document.addEventListener('keyup', e => keys[e.code]=false);

let pitch = 0, yaw = 0;
document.addEventListener('mousemove', e => {
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
});

function updateControls(delta){
  const speed = 5 * delta;
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);

  const forward = new THREE.Vector3(direction.x,0,direction.z).normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

  if(keys['KeyW']) camera.position.add(forward.clone().multiplyScalar(speed));
  if(keys['KeyS']) camera.position.add(forward.clone().multiplyScalar(-speed));
  if(keys['KeyA']) camera.position.add(right.clone().multiplyScalar(-speed));
  if(keys['KeyD']) camera.position.add(right.clone().multiplyScalar(speed));

  camera.rotation.set(pitch, yaw, 0);
}

// --- Animation Loop ---
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  updateControls(delta);
  renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
