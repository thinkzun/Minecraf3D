<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Minecraft</title>
<style>
  body { margin:0; overflow:hidden; cursor: none; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(5,2,15);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

// Terrain
const size = 10;
const geometry = new THREE.BoxGeometry(1,1,1);
for(let x=0;x<size;x++){
  for(let z=0;z<size;z++){
    const material = new THREE.MeshStandardMaterial({color:0x228B22});
    const cube = new THREE.Mesh(geometry,material);
    cube.position.set(x,0,z);
    scene.add(cube);
  }
}

// Movement
const move = { forward: false, backward: false, left: false, right: false };
const speed = 0.2;

document.addEventListener('keydown', e => {
  if(e.code === 'KeyW') move.forward = true;
  if(e.code === 'KeyS') move.backward = true;
  if(e.code === 'KeyA') move.left = true;
  if(e.code === 'KeyD') move.right = true;
});

document.addEventListener('keyup', e => {
  if(e.code === 'KeyW') move.forward = false;
  if(e.code === 'KeyS') move.backward = false;
  if(e.code === 'KeyA') move.left = false;
  if(e.code === 'KeyD') move.right = false;
});

// Mouse look
let pitch = 0;
let yaw = 0;
document.addEventListener('mousemove', e => {
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
});

// Animation
function animate(){
  requestAnimationFrame(animate);

  // Move camera
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  const forward = new THREE.Vector3(direction.x, 0, direction.z).normalize().multiplyScalar(speed * (move.forward - move.backward));
  const right = new THREE.Vector3().crossVectors(camera.up, forward).normalize().multiplyScalar(speed * (move.right - move.left));

  camera.position.add(forward).add(right);

  // Rotate camera
  camera.rotation.set(pitch, yaw, 0);

  renderer.render(scene,camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
