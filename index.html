<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First-Person Terrain</title>
<style>
  body { margin:0; overflow:hidden; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
// Scene & Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

// Renderer
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// Terrain (green blocks with varied heights)
const terrainSize = 20;
const geometry = new THREE.BoxGeometry(1,1,1);
const terrainHeights = [];

for(let x=0;x<terrainSize;x++){
  terrainHeights[x] = [];
  for(let z=0;z<terrainSize;z++){
    const height = Math.floor(Math.random()*3)+1;
    terrainHeights[x][z] = height;
    for(let y=0;y<height;y++){
      const material = new THREE.MeshStandardMaterial({color:0x228B22});
      const cube = new THREE.Mesh(geometry,material);
      cube.position.set(x,y,z);
      scene.add(cube);
    }
  }
}

// Player
const player = { x:10, y:5, z:10, speed:0.1, velocityY:0, onGround:false, pitch:0, yaw:0 };

// Movement keys
const move = { forward:false, backward:false, left:false, right:false };

document.addEventListener('keydown', e => {
  if(e.code==='KeyW') move.forward=true;
  if(e.code==='KeyS') move.backward=true;
  if(e.code==='KeyA') move.left=true;
  if(e.code==='KeyD') move.right=true;
  if(e.code==='Space' && player.onGround) player.velocityY=0.2;
});
document.addEventListener('keyup', e => {
  if(e.code==='KeyW') move.forward=false;
  if(e.code==='KeyS') move.backward=false;
  if(e.code==='KeyA') move.left=false;
  if(e.code==='KeyD') move.right=false;
});

// Mouse look
document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement !== document.body) return;
  player.yaw -= e.movementX * 0.002;
  player.pitch -= e.movementY * 0.002;
  player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
});

// Click to lock pointer
document.body.addEventListener('click', ()=>document.body.requestPointerLock());

// Gravity
const gravity = -0.01;

function animate(){
  requestAnimationFrame(animate);

  // Movement vector
  let dirX = 0, dirZ = 0;
  if(move.forward) dirZ -= 1;
  if(move.backward) dirZ += 1;
  if(move.left) dirX -= 1;
  if(move.right) dirX += 1;

  // Rotate direction by yaw
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = dirX*cos - dirZ*sin;
  const dz = dirX*sin + dirZ*cos;

  player.x += dx*player.speed;
  player.z += dz*player.speed;

  // Gravity & terrain collision
  const tx = Math.floor(Math.min(Math.max(player.x,0),terrainSize-1));
  const tz = Math.floor(Math.min(Math.max(player.z,0),terrainSize-1));
  const groundY = terrainHeights[tx][tz];

  player.velocityY += gravity;
  player.y += player.velocityY;

  if(player.y < groundY){
    player.y = groundY;
    player.velocityY = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Update camera
  camera.position.set(player.x, player.y+0.5, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  renderer.render(scene,camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
