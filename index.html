<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First-Person Terrain</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>

<!-- Three.js library -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<!-- FirstPersonControls library -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/FirstPersonControls.js"></script>

<script>
// Scene & Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(10, 2, 10);

// Renderer
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);

// Terrain (green blocks with height)
const geometry = new THREE.BoxGeometry(1,1,1);
const terrainSize = 20;
for(let x=0; x<terrainSize; x++){
  for(let z=0; z<terrainSize; z++){
    const height = Math.floor(Math.random()*3)+1;
    for(let y=0; y<height; y++){
      const material = new THREE.MeshStandardMaterial({color:0x228B22});
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x, y, z);
      scene.add(cube);
    }
  }
}

// FirstPersonControls
const controls = new THREE.FirstPersonControls(camera, renderer.domElement);
controls.movementSpeed = 0.2; // WASD speed
controls.lookSpeed = 0.1;     // Mouse look speed
controls.lookVertical = true; // Allow vertical look

const clock = new THREE.Clock();

// Animation loop
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  controls.update(delta); // Update controls each frame
  renderer.render(scene, camera);
}
animate();

// Handle window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
