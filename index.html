<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First-Person Terrain</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/PointerLockControls.js"></script>

<script>
// Scene & Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

// Renderer
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// Terrain (green blocks with some height)
const terrainSize = 20;
const geometry = new THREE.BoxGeometry(1,1,1);
const terrainHeights = []; // store heights for collision

for(let x=0;x<terrainSize;x++){
  terrainHeights[x] = [];
  for(let z=0;z<terrainSize;z++){
    const height = Math.floor(Math.random()*3)+1;
    terrainHeights[x][z] = height;
    for(let y=0;y<height;y++){
      const material = new THREE.MeshStandardMaterial({color:0x228B22});
      const cube = new THREE.Mesh(geometry,material);
      cube.position.set(x,y,z);
      scene.add(cube);
    }
  }
}

// PointerLockControls for first-person
const controls = new THREE.PointerLockControls(camera, document.body);
document.body.addEventListener('click', ()=>controls.lock());

// Player setup
const player = { x:10, y:5, z:10, speed:0.1, velocityY:0, onGround:false };

// Movement keys
const move = { forward:false, backward:false, left:false, right:false };

document.addEventListener('keydown', e => {
  if(e.code==='KeyW') move.forward=true;
  if(e.code==='KeyS') move.backward=true;
  if(e.code==='KeyA') move.left=true;
  if(e.code==='KeyD') move.right=true;
  if(e.code==='Space' && player.onGround) player.velocityY=0.2;
});
document.addEventListener('keyup', e => {
  if(e.code==='KeyW') move.forward=false;
  if(e.code==='KeyS') move.backward=false;
  if(e.code==='KeyA') move.left=false;
  if(e.code==='KeyD') move.right=false;
});

// Simple gravity
const gravity = -0.01;

function animate(){
  requestAnimationFrame(animate);

  // Movement
  const dir = new THREE.Vector3();
  if(move.forward) dir.z -= player.speed;
  if(move.backward) dir.z += player.speed;
  if(move.left) dir.x -= player.speed;
  if(move.right) dir.x += player.speed;

  // Rotate direction by camera rotation
  const angle = controls.getObject().rotation.y;
  const sin = Math.sin(angle), cos = Math.cos(angle);
  player.x += dir.x*cos - dir.z*sin;
  player.z += dir.x*sin + dir.z*cos;

  // Gravity & collision with terrain
  const terrainX = Math.floor(Math.min(Math.max(player.x,0),terrainSize-1));
  const terrainZ = Math.floor(Math.min(Math.max(player.z,0),terrainSize-1));
  const groundY = terrainHeights[terrainX][terrainZ];
  
  player.velocityY += gravity;
  player.y += player.velocityY;
  
  if(player.y < groundY){
    player.y = groundY;
    player.velocityY = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Update camera
  controls.getObject().position.set(player.x, player.y+0.5, player.z);

  renderer.render(scene,camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
