<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
import { FirstPersonControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/FirstPersonControls.js';

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// Camera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(10, 5, 25);

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Terrain
const geometry = new THREE.BoxGeometry(1,1,1);
for(let x=0;x<20;x++){
  for(let z=0;z<20;z++){
    const h = Math.floor(Math.random()*3)+1;
    for(let y=0;y<h;y++){
      const mat = new THREE.MeshStandardMaterial({color:0x228B22});
      const cube = new THREE.Mesh(geometry, mat);
      cube.position.set(x,y,z);
      scene.add(cube);
    }
  }
}

// Light
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// FirstPersonControls
const controls = new FirstPersonControls(camera, renderer.domElement);
controls.movementSpeed = 0.2;
controls.lookSpeed = 0.1;
controls.lookVertical = true;

// Clock
const clock = new THREE.Clock();

// Animation
function animate(){
    requestAnimationFrame(animate);
    controls.update(clock.getDelta());
    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
