<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First-Person Terrain</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>

<!-- Three.js r149 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<!-- FirstPersonControls for r149 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/FirstPersonControls.js"></script>

<script>
// Scene & Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky blue

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(10, 5, 25);
camera.lookAt(10,0,10);

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// Terrain: green blocks with random heights
const size = 20;
const geometry = new THREE.BoxGeometry(1,1,1);
for(let x=0;x<size;x++){
  for(let z=0;z<size;z++){
    const height = Math.floor(Math.random()*3)+1;
    for(let y=0;y<height;y++){
      const material = new THREE.MeshStandardMaterial({color:0x228B22});
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x,y,z);
      scene.add(cube);
    }
  }
}

// Floor plane (optional for visibility)
const planeGeometry = new THREE.PlaneGeometry(50,50);
const planeMaterial = new THREE.MeshStandardMaterial({color:0x006400});
const plane = new THREE.Mesh(planeGeometry, planeMaterial);
plane.rotation.x = -Math.PI/2;
plane.position.y = -0.5;
scene.add(plane);

// FirstPersonControls
const controls = new THREE.FirstPersonControls(camera, renderer.domElement);
controls.movementSpeed = 0.2; // WASD speed
controls.lookSpeed = 0.1;     // Mouse look speed
controls.lookVertical = true;

// Clock for controls
const clock = new THREE.Clock();

// Animation loop
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  controls.update(delta);
  renderer.render(scene, camera);
}
animate();

// Handle window resize
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
